[workspace]
resolver = "2"
members = [
    "crates/spatialamigo",
    "crates/spatialamigo-eval",
    "crates/spatialamigo-py",
    "crates/spatialamigo-wasm",
]
default-members = ["crates/spatialamigo", "crates/spatialamigo-eval"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Amerigo Velletti"]
repository = "https://github.com/Amerigo2020/spatialAmigo"
homepage = "https://github.com/Amerigo2020/spatialAmigo"
readme = "README.md"
keywords = ["robotics", "spatial-language", "3d", "grounding", "referit3d"]
categories = ["science::robotics", "algorithms"]

[workspace.dependencies]
spatialamigo = { path = "crates/spatialamigo", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = false
